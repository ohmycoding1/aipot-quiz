<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI-POT 확인퀴즈</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 레이아웃: 연한 회색 바탕 위 흰 카드. 학생=모바일 1열, 선생님=넓은 1열, 화면=프로젝터 2열 */
:root {
  --bg: #F3F4F6; --card: #FFFFFF; --ink: #1F2937; --sub: #6B7280; --line: #E5E7EB;
  --navy: #1E3A8A; --navyT: #E0E7FF; --orange: #EA580C; --orangeT: #FFEDD5;
  --teal: #0F766E; --tealT: #CCFBF1; --red: #DC2626; --redT: #FEE2E2;
  --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-left)) 48px max(16px, env(safe-area-inset-right)); }
.wide { max-width: 1100px; }
.card { background: var(--card); border-radius: 16px; padding: 20px; box-shadow: 0 1px 2px rgba(17,24,39,.06); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 18px; margin: 0; }
.muted { color: var(--sub); }
.small { font-size: 14px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.p-ready { background: var(--line); color: var(--sub); }
.p-open { background: var(--orangeT); color: var(--orange); }
.p-locked { background: var(--navyT); color: var(--navy); }
.p-revealed { background: var(--tealT); color: var(--teal); }
.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; background: var(--navy); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: var(--card); color: var(--navy); box-shadow: inset 0 0 0 1.5px var(--navyT); }
.btn.orange { background: var(--orange); }
.btn.teal { background: var(--teal); }
.btn.red { background: var(--red); }
.btn.sm { padding: 7px 12px; border-radius: 10px; font-size: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-weight: 700; color: var(--sub); }
.input { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--card); }
.input:focus { border-color: var(--navy); outline: none; }
.err { color: var(--red); font-weight: 600; min-height: 1.5em; }
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.brand { font-weight: 800; color: var(--navy); }
.tabs { display: flex; gap: 6px; background: var(--line); padding: 4px; border-radius: 12px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 9px 12px; border-radius: 9px; font-weight: 700; color: var(--sub); }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--navy); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.q-label { font-size: 13px; font-weight: 800; color: var(--navy); letter-spacing: .02em; }
.q-body { font-size: 18px; font-weight: 700; margin: 6px 0 14px; word-break: keep-all; }
.choices { display: grid; gap: 8px; }
.choice { display: flex; gap: 12px; align-items: center; text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.choice .n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); font-weight: 800; color: var(--navy); }
.choice[aria-pressed="true"] { border-color: var(--navy); background: var(--navyT); }
.choice[aria-pressed="true"] .n { background: var(--navy); color: #fff; }
.choice.ok { border-color: var(--teal); background: var(--tealT); }
.choice.ok .n { background: var(--teal); color: #fff; }
.choice.no { border-color: var(--red); background: var(--redT); }
.note { border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.note.wait { background: var(--navyT); color: var(--navy); }
.note.ok { background: var(--tealT); color: var(--teal); }
.note.no { background: var(--redT); color: var(--red); }
.note.ex { background: var(--bg); color: var(--ink); font-weight: 500; }
.empty { text-align: center; padding: 36px 20px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--orange); display: inline-block; animation: pulse 1.6s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
.score { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.score b { display: block; font-size: 26px; color: var(--navy); font-variant-numeric: tabular-nums; }
.score span { font-size: 13px; color: var(--sub); font-weight: 700; }
.sec-title { font-size: 15px; font-weight: 800; color: var(--sub); margin: 8px 2px 0; }
.lb { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.lb td, .lb th { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.lb th { font-size: 13px; color: var(--sub); }
.lb tr.me td { background: var(--orangeT); font-weight: 700; }
.medal { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--bg); font-weight: 800; }
.m1 { background: #FDE68A; } .m2 { background: #E5E7EB; } .m3 { background: #FED7AA; }
.bar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--navy); }
.bar.ok > i { background: var(--teal); }
.grp { display: grid; grid-template-columns: minmax(0, 1fr) 46px 120px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.grp:last-child { border-bottom: 0; }
.tbl-wrap { overflow-x: auto; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 0; border-radius: 10px; padding: 8px 12px; background: var(--card); font-weight: 700; color: var(--sub); }
.chip[aria-pressed="true"] { background: var(--navy); color: #fff; }
.modal { position: fixed; inset: 0; background: rgba(17,24,39,.45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal .card { width: min(640px, 100%); max-height: 92vh; overflow: auto; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 30; }
/* 프로젝터 화면 */
.screen { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; padding: 24px; min-height: 100vh; }
.screen .q-body { font-size: clamp(26px, 3vw, 44px); line-height: 1.35; }
.screen .choice { font-size: clamp(20px, 2vw, 30px); padding: 16px 20px; }
.screen .choice .n { width: 44px; height: 44px; }
.big-count { font-size: 64px; font-weight: 800; color: var(--orange); line-height: 1; font-variant-numeric: tabular-nums; }
.qrbox { display: grid; place-items: center; background: #fff; border-radius: 16px; padding: 16px; }
.qrbox img, .qrbox canvas { width: 100% !important; height: auto !important; max-width: 280px; }
.url { font-weight: 800; color: var(--navy); word-break: break-all; text-align: center; }
@media (max-width: 900px) { .screen { grid-template-columns: 1fr; } }
/* 학생 하단 탭 */
.wrap.has-nav { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
.bnav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom)); width: min(608px, calc(100% - 24px));
  display: flex; gap: 4px; background: var(--card); border-radius: 18px; padding: 6px; box-shadow: 0 6px 24px rgba(17,24,39,.16); z-index: 20; }
.bnav button { flex: 1; border: 0; background: transparent; border-radius: 13px; padding: 8px 4px 7px; color: var(--sub); font-weight: 700; font-size: 13px;
  display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; }
.bnav button svg { width: 22px; height: 22px; }
.bnav button[aria-selected="true"] { background: var(--navyT); color: var(--navy); }
.bnav .badge { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--orange); color: #fff; font-size: 11px; line-height: 18px; }
.sess-list { display: grid; gap: 10px; }
.sess-item { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 0; background: var(--card); border-radius: 16px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(17,24,39,.06); }
.sess-item .no { width: 46px; height: 46px; border-radius: 12px; background: var(--navyT); color: var(--navy); font-weight: 800; display: grid; place-items: center; font-size: 15px; }
.sess-item .meta { flex: 1; min-width: 0; }
.sess-item .meta b { display: block; font-size: 16px; }
.sess-item .meta span { color: var(--sub); font-size: 13px; }

.back { border: 0; background: transparent; color: var(--navy); font-weight: 700; padding: 4px 0; }
.hchip { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border-radius: 999px; padding: 6px 12px; font-weight: 800; color: var(--navy); font-size: 14px; box-shadow: 0 1px 2px rgba(17,24,39,.06); }
.prog { position: sticky; top: 0; z-index: 10; margin: 0 -16px; padding: 10px 16px; background: rgba(243,244,246,.94); backdrop-filter: blur(6px); }
.prog .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 6px; }

.qno { display: inline-grid; place-items: center; min-width: 30px; height: 26px; padding: 0 8px; border-radius: 8px; background: var(--navy); color: #fff; font-weight: 800; font-size: 14px; }
.card.done { padding: 14px 18px; }
.card.done .q-body { font-size: 16px; margin: 6px 0 10px; color: var(--sub); }
.card.flash { box-shadow: 0 0 0 3px var(--orange); }
.fchips { display: flex; gap: 6px; overflow-x: auto; }
.fchips button { flex: none; border: 0; border-radius: 999px; padding: 8px 14px; background: var(--card); font-weight: 700; color: var(--sub); font-size: 15px; }
.fchips button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.sum { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 6px; }
.sum b { display: block; font-size: 22px; color: var(--navy); }
.sum span { font-size: 13px; color: var(--sub); font-weight: 700; }
.has-nav .top { flex-wrap: nowrap; margin-bottom: 4px; }
.has-nav .top .grow > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.has-nav .hchip, .has-nav .top .btn { flex: none; }
@media (max-width: 380px) { .has-nav .top .brand { font-size: 15px; } .has-nav .hchip { padding: 5px 10px; font-size: 13px; } }
/* 미션 */
.m-body { white-space: pre-wrap; word-break: keep-all; color: var(--ink); background: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
textarea.input { min-height: 140px; resize: vertical; line-height: 1.5; }
.fbox { border: 1.5px dashed var(--line); border-radius: 12px; padding: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.fbox img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; background: var(--bg); }
.fname { font-weight: 700; word-break: break-all; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.subpre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 14px/1.5 var(--font); max-height: 220px; overflow: auto; background: var(--bg); border-radius: 10px; padding: 8px 10px; }
/* 미션 갤러리 */
.mgal, .rgal { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 640px) { .mgal, .rgal { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.mtile, .rtile { border: 0; padding: 0; text-align: left; background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(17,24,39,.06), 0 4px 14px rgba(17,24,39,.05); display: flex; flex-direction: column; color: var(--ink); transition: transform .15s ease; }

.thumb .ph b { font-size: 34px; line-height: 1; } .thumb .ph span { font-size: 13px; font-weight: 700; }
.thumb .tx { position: absolute; inset: 0; padding: 12px; font-size: 13px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; overflow: hidden; color: var(--ink); background: linear-gradient(180deg, #fff 0%, var(--bg) 100%); -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent); mask-image: linear-gradient(180deg, #000 70%, transparent); }
.tbadge { position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,.92); color: var(--navy); font-size: 12px; font-weight: 800; border-radius: 999px; padding: 3px 9px; }
.tbadge.sh { color: var(--teal); }
.tbadge.aw { left: auto; right: 8px; background: #FEF3C7; color: #92400E; }
.tbadge.vote-me { top: auto; bottom: 8px; background: var(--orange); color: #fff; }
.mtile .tb { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.mtile .tb b { font-size: 15px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.hz { color: var(--red); font-weight: 800; }
.rtile.mine { box-shadow: 0 0 0 2px var(--orange); }
.heart { position: absolute; right: 8px; bottom: 8px; background: rgba(17,24,39,.72); color: #fff; font-weight: 800; font-size: 13px; border-radius: 999px; padding: 4px 10px; }
.heart.on { background: var(--red); }
.rn { padding: 8px 10px; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me { display: inline-block; background: var(--orangeT); color: var(--orange); font-size: 11px; font-weight: 800; border-radius: 6px; padding: 1px 6px; vertical-align: 1px; }
.award { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.award .chip { padding: 5px 10px; font-size: 13px; box-shadow: inset 0 0 0 1.5px var(--line); }
.award .chip[aria-pressed="true"] { background: #F59E0B; color: #fff; box-shadow: none; }
.mats { padding: 6px 16px; }
.mat { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.mat:last-child { border-bottom: 0; }
.mat.hid { opacity: .55; }
.fk { flex: none; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 12px; font-weight: 800; letter-spacing: .02em; }
.k-pdf { background: #FEE2E2; color: #B91C1C; } .k-ppt { background: #FFEDD5; color: #C2410C; } .k-doc { background: #DBEAFE; color: #1D4ED8; }
.k-xls { background: #DCFCE7; color: #15803D; } .k-img { background: var(--tealT); color: var(--teal); } .k-zip { background: #E5E7EB; color: #374151; }
.k-code { background: #EDE9FE; color: #6D28D9; } .k-etc { background: var(--navyT); color: var(--navy); }

<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const CFG = window.QUIZ_CONFIG || {};
const app = document.getElementById("app");
const SESSIONS = CFG.SESSIONS || 10;
const BASE_URL = location.origin + location.pathname;
let sb = null;
let timer = null;
let channel = null;

// ---------- 공통 도우미 ----------
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
  } catch (e) { return null; }
}
function sstore(k, v) {
  try {
    if (v === undefined) return sessionStorage.getItem(k);
    if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v);
  } catch (e) { return null; }
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 2200);
}
async function rpc(name, args) {
  const res = await sb.rpc(name, args || {});
  if (res.error) return { error: "서버 연결 오류: " + res.error.message };
  return res.data || {};
}
function stopLoops() {
  if (timer) { clearInterval(timer); timer = null; }
  if (channel) { sb.removeChannel(channel); channel = null; }
}
function onLive(fn) {
  channel = sb.channel("live-" + Date.now())
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "live" }, function () { fn(); })
    .subscribe();
}
const STATUS = { ready: "대기", open: "풀이 중", locked: "마감", revealed: "정답 공개" };
function statusPill(s) { return '<span class="pill p-' + s + '">' + STATUS[s] + "</span>"; }
function circled(i) { return "①②③④⑤⑥⑦⑧"[i] || (i + 1) + "."; }
function answerText(q) {
  if (!q.answer) return "";
  if (q.kind === "mc") {
    const parts = [];
    for (const a of q.answer) {
      const i = parseInt(a, 10) - 1;
      parts.push(circled(i) + " " + (q.choices[i] || ""));
    }
    return parts.join(", ");
  }
  return q.answer[0];
}
function myText(q, r) {
  if (r == null) return "";
  if (q.kind === "mc") {
    const i = parseInt(r, 10) - 1;
    return circled(i) + " " + (q.choices[i] || "");
  }
  return r;
}


// ---------- 복사 · 붙여넣기 막기 (학생 · 프로젝터 화면) ----------
(function () {
  const on = function () { return document.body.classList.contains("noCopy"); };
  const isField = function (el) { return el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA"); };
  const isLogin = function (el) { return el && (el.id === "sid" || el.id === "spin" || el.id === "sname" || (el.dataset && el.dataset.allowpaste === "1")); };
  let last = 0;
  const warn = function (m) { const n = Date.now(); if (n - last > 1500) { last = n; toast(m); } };
  ["copy", "cut"].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      if (!on() || isField(e.target)) return;
      e.preventDefault();
      if (e.clipboardData) e.clipboardData.setData("text/plain", "");
      warn("문제는 복사할 수 없어요");
    }, true);
  });
  document.addEventListener("paste", function (e) {
    if (!on() || isLogin(e.target)) return;
    e.preventDefault();
    warn("붙여넣기는 쓸 수 없어요. 직접 입력해 주세요");
  }, true);
  document.addEventListener("drop", function (e) {
    if (!on() || isLogin(e.target)) return;
    e.preventDefault();
  }, true);
  ["contextmenu", "dragstart", "selectstart"].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      if (!on() || isField(e.target)) return;
      e.preventDefault();
    }, true);
  });
  document.addEventListener("keydown", function (e) {
    if (!on() || !(e.ctrlKey || e.metaKey)) return;
    const k = (e.key || "").toLowerCase();
    if (k === "p" || k === "s") { e.preventDefault(); return; }
    if (isField(e.target)) { if (k === "v" && !isLogin(e.target)) { e.preventDefault(); warn("붙여넣기는 쓸 수 없어요. 직접 입력해 주세요"); } return; }
    if (k === "c" || k === "x" || k === "a") { e.preventDefault(); warn("문제는 복사할 수 없어요"); }
  }, true);
  // 음성 · 자동완성 붙여넣기 등 paste 이벤트 없이 들어오는 경우도 막기
  document.addEventListener("beforeinput", function (e) {
    if (!on() || isLogin(e.target)) return;
    if (e.inputType === "insertFromPaste" || e.inputType === "insertFromDrop" || e.inputType === "insertFromPasteAsQuotation") {
      e.preventDefault(); warn("붙여넣기는 쓸 수 없어요. 직접 입력해 주세요");
    }
  }, true);
})();

function route() {
  stopLoops();
  const h = location.hash.replace("#", "");
  document.body.classList.toggle("noCopy", h !== "teacher");
  if (h === "teacher") return teacherView();
  if (h.indexOf("screen") === 0) return screenView(parseInt(h.split("-")[1], 10) || parseInt(store("quiz_session") || "1", 10));
  return studentView();
}

const S = { tab: "live", past: null, filter: "all", jump: false, data: null, sig: "", pick: {}, draft: {}, busy: {}, missions: [], mats: [], mopen: null, mview: null, mdraft: {}, mfile: {}, mbusy: {}, pending: false };

  try { const sv = JSON.parse(store("quiz_drafts_" + token) || "{}"); S.pick = sv.pick || {}; S.draft = sv.draft || {}; } catch (e) { S.pick = {}; S.draft = {}; }

async function loadStudent(force) {
  const both = await Promise.all([rpc("student_state", { p_token: S.token }), rpc("student_missions", { p_token: S.token }), rpc("student_materials", { p_token: S.token })]);
  const r = both[0], mr = both[1], tr = both[2];
  if (r.error === "LOGIN") { store("quiz_token", null); return studentLogin("다시 로그인해 주세요."); }
  if (r.error) { if (force) app.innerHTML = '<div class="wrap"><div class="card err">' + esc(r.error) + "</div></div>"; return; }
  const ms = mr && !mr.error && mr.missions ? mr.missions : [];
  const mats = tr && !tr.error && tr.materials ? tr.materials : [];
  const sig = JSON.stringify(r) + JSON.stringify(ms) + JSON.stringify(mats);
  if (!force && sig === S.sig) return;
  S.sig = sig; S.data = r; S.missions = ms; S.mats = mats;
  // 미션 글을 쓰는 중이면 화면을 다시 그리지 않고 기다림
  const ae = document.activeElement;
  if (!force && ae && ae.dataset && ae.dataset.mtext) { S.pending = true; return; }
  renderStudent();
}

function renderStudent() {
  const d = S.data;
  const focusId = document.activeElement && document.activeElement.id;
  const sc = d.score;
  const qs = d.questions.slice().sort(function (a, b) { return a.session - b.session || a.qno - b.qno; });
  const live = qs.filter(function (q) { return q.status === "open" || q.status === "locked"; });
  const done = qs.filter(function (q) { return q.status === "revealed"; });
  prefill(live);
  const todoList = live.filter(function (q) { return q.status === "open" && !localAns(q); });
  const by = {};
  for (const q of done) (by[q.session] = by[q.session] || []).push(q);
  const sessions = Object.keys(by).map(Number).sort(function (a, b) { return b - a; });
  const stat = function (list) {
    const ok = list.filter(function (q) { return q.is_correct; }).length;
    const pts = list.reduce(function (m, q) { return m + (q.is_correct ? q.points : 0); }, 0);
    return { ok: ok, pts: pts, n: list.length, miss: list.filter(function (q) { return q.response == null; }).length };
  };

  let html = '<div class="wrap stack has-nav">' +
    '<div class="top"><div class="grow"><div class="brand">' + esc(CFG.TITLE || "확인퀴즈") + "</div>" +
    '<div class="muted small">' + esc(d.me.name) + " · " + esc(d.me.student_id) + "</div></div>" +
    '<span class="hchip">' + sc.points + "점" + (sc.rank ? " · " + sc.rank + "위" : "") + "</span>" +
    '<button class="btn ghost sm" id="logout">나가기</button></div>';

  const openM = S.missions.filter(function (m) { return m.status === "open"; });
  const todoM = openM.filter(function (m) { return !m.mine; }).length;
  if (S.tab === "live") {
    if (openM.length) html += '<button class="mbanner" data-tab="mission">' + ICON.mission.replace("<svg", '<svg width="22" height="22"') + '<span class="grow">미션이 열렸어요: ' + esc(openM[0].title) + (openM.length > 1 ? " 외 " + (openM.length - 1) + "개" : "") + "</span><span>미션 탭 ›</span></button>";
    if (!live.length) {
      if (sessions.length) {
        const n = sessions[0], st = stat(by[n]);
        html += '<div class="card stack"><div><span class="pill p-revealed">정답 공개</span></div>' +
          "<h2>" + n + "차시 결과가 나왔어요</h2>" +
          '<p class="muted" style="margin:0">' + st.n + "문제 중 " + st.ok + "개 맞힘 · +" + st.pts + "점</p>" +
          '<button class="btn" data-goto="' + n + '">' + n + "차시 정답 · 해설 보기</button></div>";
      }
      html += '<div class="card empty"><span class="dot"></span><h2 style="margin-top:10px">문제가 열리면 바로 나타나요</h2>' +
        '<p class="muted small">화면을 켜 둔 채로 기다려 주세요.<br>지난 문제는 아래 \'지난 시험\'에서 볼 수 있어요.</p></div>';
    } else {
      const ss = live.map(function (q) { return q.session; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
      const open = live.filter(function (q) { return q.status === "open"; });
      const written = open.filter(function (q) { return !!localAns(q); }).length;
      const dirty = open.filter(function (q) { return localAns(q) && localAns(q) !== (q.response == null ? "" : String(q.response).trim()); }).length;
      const submitted = live.filter(function (q) { return q.response != null; }).length;
      const locked = !open.length;
      html += '<div class="prog"><div class="row" style="gap:8px"><b>' + ss.join(" · ") + "차시</b>" +
        '<span class="muted small grow">' + (locked ? "제출 마감 · 정답 공개를 기다려요" : "작성 " + written + " / " + open.length) + "</span>" +
        (!locked && written < open.length ? '<button class="btn sm orange" id="jump">안 푼 문제 ' + (open.length - written) + "개 ↓</button>" :
          !locked && (dirty || submitted < open.length) ? '<button class="btn sm orange" id="jump">답안 제출하러 가기 ↓</button>' : "") + "</div>" +
        '<div class="bar"><i style="width:' + Math.round((locked ? submitted : written) * 100 / live.length) + '%"></i></div></div>';
      if (locked) html += '<div class="note ex">제출 ' + submitted + " / " + live.length + "문제 · 선생님이 정답을 공개하면 결과가 나와요.</div>";
      else html += '<p class="muted small" style="margin:-4px 2px 0">답을 모두 고른 뒤 맨 아래 <b>답안 제출</b>을 눌러요. 마감 전까지는 다시 고치고 또 제출할 수 있어요.</p>';
      live.forEach(function (q, k) { html += studentCard(q, k + 1, live.length); });
      if (!locked) {
        const allSent = submitted >= open.length && !dirty;
        html += '<div class="card stack" id="subbar" style="text-align:center">' +
          '<div class="small muted">' + (allSent ? "모두 제출했어요. 고치려면 답을 바꾸고 다시 제출하세요." : "작성 " + written + " / " + open.length + (dirty && submitted ? " · 바뀐 답 " + dirty + "개" : "")) + "</div>" +
          '<button class="btn orange" id="submitall" style="width:100%"' + (written && !S.sending && !allSent ? "" : " disabled") + ">" +
          (S.sending ? "제출 중…" : allSent ? "제출 완료 ✓" : submitted ? "수정한 답안 다시 제출" : "답안 제출 (" + written + "/" + open.length + ")") + "</button></div>";
      }
    }
  } else if (S.tab === "past") {
    if (S.past && !by[S.past]) S.past = null;
    if (!S.past) {
      html += '<div class="sec-title">지난 시험</div>';
      if (!sessions.length) html += '<div class="card empty muted">정답이 공개된 시험이 아직 없어요.</div>';
      html += '<div class="sess-list">';
      for (const n of sessions) {
        const st = stat(by[n]);
        html += '<button class="sess-item" data-past="' + n + '"><span class="no">' + n + '차시</span><span class="meta"><b>' + n + "차시 확인 문제</b><span>" +
          st.n + "문제 중 " + st.ok + "개 맞힘" + (st.n - st.ok ? " · 틀린 문제 " + (st.n - st.ok) + "개" : "") + '</span></span><span class="pts">' + st.pts + '점</span><span class="muted">›</span></button>';
      }
      html += "</div>";
    } else {
      const list = by[S.past], st = stat(list);
      const wrong = list.filter(function (q) { return !q.is_correct; });
      const missN = list.filter(function (q) { return q.response == null; }).length;
      const shown = S.filter === "wrong" ? wrong : list;
      html += '<div class="row"><button class="back" id="pastback">‹ 차시 목록</button></div>' +
        '<div class="card"><div class="q-label" style="margin-bottom:10px">' + S.past + "차시 결과</div>" +
        '<div class="sum"><div><b>' + st.ok + "/" + st.n + "</b><span>맞힌 문제</span></div><div><b>" + Math.round(st.ok * 100 / st.n) + "%</b><span>정답률</span></div><div><b>" + st.pts + "</b><span>점수</span></div></div></div>" +
        '<div class="fchips"><button data-filter="all" aria-pressed="' + (S.filter !== "wrong") + '">전체 ' + st.n + '</button>' +
        '<button data-filter="wrong" aria-pressed="' + (S.filter === "wrong") + '">다시 볼 문제 ' + wrong.length + "</button></div>" +
        (S.filter === "wrong" && wrong.length ? '<p class="muted small" style="margin:-4px 2px 0">틀린 문제 ' + (wrong.length - missN) + "개 · 안 푼 문제 " + missN + "개</p>" : "");
      if (!shown.length) html += '<div class="card empty muted">틀린 문제가 없어요. 완벽해요!</div>';
      shown.forEach(function (q) { html += studentCard(q, list.indexOf(q) + 1, list.length); });
    }
  } else if (S.tab === "mission") {
    html += missionTab();
  } else if (S.tab === "mats") {
    html += matsTab();
  } else {
    html += '<div class="card score"><div><b>' + sc.points + '</b><span>내 점수</span></div><div><b>' + sc.correct + '</b><span>맞힌 문제</span></div>' +
      "<div><b>" + (sc.rank ? sc.rank + '<small style="font-size:15px">/' + sc.total + "</small>" : "-") + "</b><span>내 순위</span></div></div>" +
      '<div class="sec-title">순위 보드 · TOP 5</div><div class="card" id="lbcard"><div class="muted">순위를 불러오는 중…</div></div>' +
      '<p class="muted small" style="text-align:center">상위 5명만 공개돼요. 이름 가운데는 * 로 가려져요.</p>';
  }
  html += "</div>";
  const seen = Number(store("quiz_mat_seen") || 0);
  const newMats = S.tab === "mats" ? 0 : S.mats.filter(function (x) { return x.id > seen; }).length;
  if (S.tab === "mats" && S.mats.length) store("quiz_mat_seen", String(Math.max.apply(null, S.mats.map(function (x) { return x.id; }))));
  const tabs = [["live", "진행 중", todoList.length], ["mission", "미션", todoM], ["mats", "자료", newMats], ["past", "지난 시험", 0], ["rank", "순위", 0]];
  html += '<nav class="bnav" role="tablist">' + tabs.map(function (t) {
    return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + ICON[t[0]] + "<span>" + t[1] + "</span>" +
      (t[2] ? '<span class="badge">' + t[2] + "</span>" : "") + "</button>";
  }).join("") + "</nav>";
  const y = window.scrollY;
  app.innerHTML = html;
  window.scrollTo(0, y);

  document.getElementById("logout").onclick = function () { store("quiz_token", null); route(); };
  for (const b of app.querySelectorAll("[data-tab]")) {
    b.onclick = function () { S.tab = b.dataset.tab; S.past = null; S.mopen = null; S.mview = null; S.filter = "all"; renderStudent(); window.scrollTo(0, 0); };
  }
  for (const b of app.querySelectorAll("[data-past]")) {
    b.onclick = function () { S.past = Number(b.dataset.past); S.filter = "all"; renderStudent(); window.scrollTo(0, 0); };
  }
  for (const b of app.querySelectorAll("[data-goto]")) {
    b.onclick = function () { S.tab = "past"; S.past = Number(b.dataset.goto); S.filter = "all"; renderStudent(); window.scrollTo(0, 0); };
  }
  for (const b of app.querySelectorAll("[data-filter]")) {
    b.onclick = function () { S.filter = b.dataset.filter; renderStudent(); };
  }
  bindMissions();
  const pb = document.getElementById("pastback");
  if (pb) pb.onclick = function () { S.past = null; renderStudent(); window.scrollTo(0, 0); };
  const jb = document.getElementById("jump");
  if (jb) jb.onclick = function () { scrollToNext(); };
  for (const b of app.querySelectorAll("[data-pick]")) {
    b.onclick = function () { S.pick[b.dataset.q] = b.dataset.pick; saveDrafts(); renderStudent(); };
  }
  for (const inp of app.querySelectorAll("[data-draft]")) {
    inp.oninput = function () { S.draft[inp.dataset.draft] = inp.value; saveDrafts(); };
    inp.onchange = function () { renderStudent(); };
    inp.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); inp.blur(); } };
  }
  const sa = document.getElementById("submitall");
  if (sa) sa.onclick = function () { submitAll(false); };
  for (const b of app.querySelectorAll("[data-confirm]")) {
    b.onclick = function () { const m = document.getElementById("cfm"); if (m) m.remove(); if (b.dataset.confirm === "go") submitAll(true); else scrollToNext(); };
  }
  if (focusId) { const el = document.getElementById(focusId); if (el) el.focus({ preventScroll: true }); }
  if (S.tab === "rank") loadBoard(document.getElementById("lbcard"), null, 5, d.me, sc);
  if (S.jump) { S.jump = false; setTimeout(scrollToNext, 350); }
}

const FILE_ACCEPT = "image/*,.pdf,.txt,.py,.csv,.json,.zip,.docx,.pptx,.xlsx";
function fileUrl(path) { return CFG.SUPABASE_URL + "/storage/v1/object/public/missions/" + path.split("/").map(encodeURIComponent).join("/"); }
function isImg(t, n) { return /^image\/(png|jpe?g|gif|webp)$/i.test(t || "") || /\.(png|jpe?g|gif|webp)$/i.test(n || ""); }
function fileView(f, big) {
  if (!f || !f.file_path) return "";
  const u = fileUrl(f.file_path);
  if (isImg(f.file_type, f.file_name)) return '<a href="' + u + '" target="_blank" rel="noopener"><img src="' + u + '" alt="' + esc(f.file_name || "첨부 그림") + '" loading="lazy"></a>';
  return '<a class="btn ghost sm" href="' + u + '" target="_blank" rel="noopener">📎 ' + esc(f.file_name || "첨부 파일") + "</a>";
}
function fmtTime(t) { try { const d = new Date(t); return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); } catch (e) { return ""; } }
const MSTATUS = { open: ["제출 중", "p-open"], closed: ["마감", "p-closed"], shared: ["결과 공개 · 투표", "p-shared"] };
function storeUrl(bucket, path, dl) {

async function uploadMissionFile(id, f) {
  if (f.size > 10 * 1024 * 1024) { toast("10MB 이하 파일만 올릴 수 있어요"); return; }
  S.mbusy[id] = "up"; renderStudent();
  try {
    const t = await rpc("student_mission_ticket", { p_token: S.token, p_mid: id });
    if (t.error) { toast(t.error); return; }
    const m = /\.[A-Za-z0-9]{1,6}$/.exec(f.name);
    const path = t.ticket + "/" + Date.now() + (m ? m[0].toLowerCase() : "");
    const up = await sb.storage.from("missions").upload(path, f, { contentType: f.type || "application/octet-stream", upsert: false });
    if (up.error) { toast("업로드 실패: " + up.error.message); return; }
    S.mfile[id] = { path: path, name: f.name, type: f.type || "" };
    toast("파일을 올렸어요. 제출을 눌러야 반영돼요");
  } finally { S.mbusy[id] = null; renderStudent(); }
}
async function submitMission(id) {
  const m = S.missions.find(function (x) { return x.id === id; });
  if (!m) return;
  const ta = document.getElementById("mt-" + id);
  if (ta) S.mdraft[id] = ta.value;
  const pf = S.mfile[id];
  S.mbusy[id] = "send"; renderStudent();
  const r = await rpc("student_mission_submit", {
    p_token: S.token, p_mid: id, p_body: S.mdraft[id] != null ? S.mdraft[id] : (m.mine ? m.mine.body : ""),
    p_file_path: pf ? pf.path : null, p_file_name: pf ? pf.name : null, p_file_type: pf ? pf.type : null, p_clear_file: pf === null
  });
  S.mbusy[id] = null;
  if (r.error) { toast(r.error); renderStudent(); return; }
  delete S.mdraft[id]; delete S.mfile[id];
  toast("제출했어요");

}

function studentCard(q, no, total) {

  let pill;
  if (q.status === "revealed") pill = answered ? (q.is_correct ? '<span class="pill p-revealed">정답 +' + q.points + "</span>" : '<span class="pill" style="background:var(--redT);color:var(--red)">오답</span>') : '<span class="pill p-ready">미제출</span>';
  else if (q.status === "locked") pill = answered ? '<span class="pill p-locked">제출됨</span>' : '<span class="pill p-ready">미제출</span>';

  else if (changed) pill = '<span class="pill p-open">' + (answered ? "수정됨 · 제출 필요" : "작성함 · 제출 전") + "</span>";
  else pill = '<span class="pill p-revealed">제출됨</span>';
  const head = '<div class="row"><span class="qno">' + no + '</span><span class="q-label grow">' + (total ? no + " / " + total : "") + "</span>" + pill + "</div>";
  let h = '<div class="card" id="q-' + q.id + '">' + head + '<div class="q-body">' + esc(q.body) + "</div>";
  if (q.kind === "mc") {
    h += '<div class="choices">';
    for (let i = 0; i < q.choices.length; i++) {
      const v = String(i + 1);
      let cls = "choice";
      let pressed = false;
      if (q.status === "revealed") {
        if (q.answer && q.answer.indexOf(v) >= 0) cls += " ok";
        else if (q.response === v) cls += " no";
      } else if (q.status === "locked") {
        pressed = q.response === v;
      } else {
        pressed = S.pick[q.id] === v;
      }
      h += '<button class="' + cls + '" aria-pressed="' + pressed + '"' + (canAnswer ? ' data-q="' + q.id + '" data-pick="' + v + '"' : " disabled") +

    }

      '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">';
  } else if (q.status === "locked" && answered) {
    h += '<div class="note wait">내 답: ' + esc(q.response) + "</div>";
  }
  if (canAnswer) {
    // 제출은 맨 아래 '답안 제출' 버튼으로 한 번에
  } else if (q.status === "locked" && !answered) {
    h += '<div class="note ex" style="margin-top:12px">제출 시간이 끝났어요. 정답 공개를 기다려 주세요.</div>';
  } else if (q.status === "revealed") {
    if (!answered) h += '<div class="note ex" style="margin-top:12px">제출하지 않았어요 · 정답: <b>' + esc(answerText(q)) + "</b></div>";
    else if (q.is_correct) h += '<div class="note ok" style="margin-top:12px">정답! +' + q.points + "점" + (q.kind === "short" ? " · 내 답: " + esc(q.response) : "") + "</div>";

async function submitAll(force) {
  const open = S.data.questions.filter(function (q) { return q.status === "open"; });
  const ans = {};
  let blank = 0;
  for (const q of open) { const v = localAns(q); if (v) ans[q.id] = v; else blank++; }
  if (!Object.keys(ans).length) { toast("먼저 답을 골라 주세요"); return; }
  if (blank && !force) {
    const m = document.createElement("div");
    m.className = "modal"; m.id = "cfm";
    m.innerHTML = '<div class="card stack" style="max-width:360px;text-align:center"><h2>안 푼 문제가 ' + blank + "개 있어요</h2>" +
      '<p class="muted" style="margin:0">지금 제출해도 마감 전까지는 나머지를 풀어서 다시 제출할 수 있어요.</p>' +
      '<button class="btn" data-confirm="back">안 푼 문제 풀기</button><button class="btn ghost" data-confirm="go">이대로 제출</button></div>';
    document.body.appendChild(m);
    for (const b of m.querySelectorAll("[data-confirm]")) {
      b.onclick = function () { m.remove(); if (b.dataset.confirm === "go") submitAll(true); else scrollToNext(); };
    }
    return;
  }
  S.sending = true; renderStudent();
  const r = await rpc("student_submit_all", { p_token: S.token, p_answers: ans });
  S.sending = false;
  if (r.error) toast(r.error === "LOGIN" ? "다시 로그인해 주세요" : r.error);
  else toast(r.saved + "문제 제출했어요! 마감 전까지 수정할 수 있어요");
  loadStudent(true);
}

async function loadBoard(el, session, limit, me, sc) {
  const r = await rpc("leaderboard", { p_session: session, p_limit: limit });
  if (!el) return;
  if (r.error) { el.innerHTML = '<div class="err">' + esc(r.error) + "</div>"; return; }
  if (!r.length) { el.innerHTML = '<div class="muted">아직 공개된 점수가 없어요. 첫 정답 공개를 기다려 주세요.</div>'; return; }
  let h = '<table class="lb"><thead><tr><th>순위</th><th>이름</th><th>점수</th><th>정답</th></tr></thead><tbody>';
  for (const p of r.slice(0, limit)) {
    const mine = me && me.student_id.slice(-4) === p.sid && maskName(me.name) === p.name;
    h += '<tr class="' + (mine ? "me" : "") + '"><td><span class="medal ' + (p.rank <= 3 ? "m" + p.rank : "") + '">' + p.rank + "</span></td>" +
      "<td>" + esc(p.name) + (mine ? ' <span class="small" style="color:var(--navy)">(나)</span>' : "") + "</td><td><b>" + p.points + "</b></td><td>" + p.correct + "</td></tr>";
  }
  if (sc && sc.rank && sc.rank > limit) {
    h += '<tr class="me"><td><span class="medal">' + sc.rank + "</span></td><td>나</td><td><b>" + sc.points + "</b></td><td>" + sc.correct + "</td></tr>";
  }
  el.innerHTML = h + "</tbody></table>";
}
function maskName(n) {
  if (n.length <= 1) return n;
  if (n.length === 2) return n[0] + "*";
  return n[0] + "*".repeat(n.length - 2) + n[n.length - 1];
}

const T = { tab: "run", session: parseInt(store("quiz_session") || "1", 10), data: null, sig: "", confirm: null, studs: null };

function teacherView() {
  const pin = sstore("quiz_tpin");
  if (!pin) return teacherLogin();
  T.pin = pin;
  app.innerHTML = '<div class="wrap wide"><div class="card empty muted">불러오는 중…</div></div>';
  loadTeacher(true);
  timer = setInterval(function () { if (T.tab === "run") loadTeacher(false); else if (T.tab === "mission") loadTMissions(false); }, 3000);
}

function teacherLogin(msg) {
  app.innerHTML = '<div class="wrap stack" style="padding-top:10vh"><form class="card stack" id="tf" novalidate>' +
    '<div><div class="brand">선생님 화면</div><h1 style="margin-top:4px">선생님 PIN</h1></div>' +
    '<input class="input" id="tpin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Supabase SQL에서 정한 PIN">' +
    '<div class="err" id="terr">' + esc(msg || "") + '</div><button class="btn" type="submit">들어가기</button>' +
    '<a class="small muted" href="#">← 학생 화면</a></form></div>';
  document.getElementById("tf").addEventListener("submit", async function (e) {
    e.preventDefault();
    const pin = document.getElementById("tpin").value;
    const r = await rpc("teacher_login", { p_pin: pin });
    if (r.error) { document.getElementById("terr").textContent = r.error; return; }
    sstore("quiz_tpin", pin);
    teacherView();
  });
}

async function loadTeacher(force) {
  const r = await rpc("teacher_overview", { p_pin: T.pin, p_session: T.session });
  if (r.error === "PIN") { sstore("quiz_tpin", null); return teacherLogin("PIN을 다시 입력해 주세요."); }
  if (r.error) { toast(r.error); return; }
  const sig = JSON.stringify(r);
  if (!force && sig === T.sig) return;
  if (!force && document.querySelector(".modal")) return;
  T.sig = sig; T.data = r;
  renderTeacher();
}

function renderTeacher() {
  const d = T.data;
  let h = '<div class="wrap wide stack"><div class="top"><div class="grow"><div class="brand">선생님 화면</div>' +
    '<div class="muted small">등록 학생 ' + d.students + "명</div></div>" +
    '<a class="btn ghost sm" href="#screen-' + T.session + '" target="_blank" rel="noopener">프로젝터 화면 열기</a>' +
    '<button class="btn ghost sm" id="tout">나가기</button></div>' +
    '<div class="chips">';
  for (let i = 1; i <= SESSIONS; i++) {
    const has = d.sessions.indexOf(i) >= 0;
    h += '<button class="chip" data-sess="' + i + '" aria-pressed="' + (i === T.session) + '">' + i + "차시</button>";
  }
  h += '</div><div class="tabs" role="tablist"><button role="tab" data-ttab="run" aria-selected="' + (T.tab === "run") + '">문제 운영</button>' +
    '<button role="tab" data-ttab="mission" aria-selected="' + (T.tab === "mission") + '">미션</button>' +
    '<button role="tab" data-ttab="mats" aria-selected="' + (T.tab === "mats") + '">자료</button>' +
    '<button role="tab" data-ttab="students" aria-selected="' + (T.tab === "students") + '">점수 · 학생</button></div>';

  if (T.tab === "run") {
    const qs = d.questions;
    const cnt = function (st) { return qs.filter(function (q) { return q.status === st; }).length; };
    const readyN = cnt("ready"), openN = cnt("open"), lockN = cnt("locked"), revN = cnt("revealed");
    const stage = openN ? "풀이 중" : lockN ? "마감" : revN && !readyN ? "정답 공개 완료" : revN ? "일부 공개" : "대기";
    h += '<div class="card"><div class="row"><b>' + T.session + '차시 문제 ' + qs.length + '개</b><span class="pill p-' + (openN ? "open" : lockN ? "locked" : revN ? "revealed" : "ready") + '">' + stage + '</span>' +
      '<span class="small muted">대기 ' + readyN + ' · 풀이 중 ' + openN + ' · 마감 ' + lockN + ' · 공개 ' + revN + '</span></div>' +
      '<div class="row" style="margin-top:12px">' +
      '<button class="btn orange" id="openall"' + (readyN + lockN ? "" : " disabled") + '>' + T.session + '차시 전체 열기</button>' +
      '<button class="btn" id="lockall"' + (openN ? "" : " disabled") + '>전체 제출 마감</button>' +
      '<button class="btn teal" id="revall"' + (openN + lockN ? "" : " disabled") + '>전체 정답 공개</button>' +
      '<span class="grow"></span>' +
      (T.confirm === "all"
        ? '<span class="small err">이 차시 제출 기록이 모두 지워져요.</span><button class="btn red sm" id="resetall">전체 초기화 확인</button><button class="btn ghost sm" data-cancel="1">취소</button>'
        : '<button class="btn ghost sm" id="resetask"' + (openN + lockN + revN ? "" : " disabled") + '>전체 초기화</button>') +
      '<button class="btn ghost sm" id="newq">+ 새 문제</button></div></div>';
    if (!qs.length) h += '<div class="card empty muted">' + T.session + "차시 문제가 아직 없어요. ‘+ 새 문제’로 추가하세요.</div>";
    for (const q of qs) h += teacherCard(q, d.students);
  } else if (T.tab === "mission") {
    h += '<div class="stack" id="tmis"><div class="card muted">불러오는 중…</div></div>';
  } else if (T.tab === "mats") {
    h += '<div class="stack" id="tmats"><div class="card muted">불러오는 중…</div></div>';
  } else {
    h += '<div class="card" id="studs"><div class="muted">불러오는 중…</div></div>';
  }
  app.innerHTML = h + "</div>";

  document.getElementById("tout").onclick = function () { sstore("quiz_tpin", null); route(); };
  for (const b of app.querySelectorAll("[data-sess]")) {
    b.onclick = function () { T.session = parseInt(b.dataset.sess, 10); store("quiz_session", String(T.session)); T.msig = ""; loadTeacher(true); };
  }
  for (const b of app.querySelectorAll("[data-ttab]")) {
    b.onclick = function () { T.tab = b.dataset.ttab; renderTeacher(); };
  }
  if (T.tab === "students") return loadStudents();
  if (T.tab === "mission") return loadTMissions(true);
  if (T.tab === "mats") return loadTMats();
  document.getElementById("newq").onclick = function () {
    const next = T.data.questions.reduce(function (m, q) { return Math.max(m, q.qno); }, 0) + 1;
    editQuestion({ session: T.session, qno: next, label: "", kind: "mc", body: "", choices: ["", "", "", ""], answer: [], explanation: "", points: 10 });
  };
  document.getElementById("openall").onclick = function () { bulk("open"); };
  document.getElementById("lockall").onclick = function () { bulk("locked"); };
  document.getElementById("revall").onclick = function () { bulk("revealed"); };
  const ra = document.getElementById("resetask");
  if (ra) ra.onclick = function () { T.confirm = "all"; renderTeacher(); };
  const rs = document.getElementById("resetall");
  if (rs) rs.onclick = function () { T.confirm = null; bulk("ready"); };
  for (const b of app.querySelectorAll("[data-set]")) {
    b.onclick = async function () {
      const qid = Number(b.dataset.qid);
      if (b.dataset.set === "ready" && T.confirm !== qid) { T.confirm = qid; renderTeacher(); return; }
      T.confirm = null;
      const r = await rpc("teacher_set_status", { p_pin: T.pin, p_qid: qid, p_status: b.dataset.set });
      if (r.error) toast(r.error);
      loadTeacher(true);
    };
  }
  for (const b of app.querySelectorAll("[data-cancel]")) b.onclick = function () { T.confirm = null; T.delAsk = null; renderTeacher(); };
  for (const b of app.querySelectorAll("[data-delask]")) b.onclick = function () { T.delAsk = Number(b.dataset.delask); T.confirm = null; renderTeacher(); };
  for (const b of app.querySelectorAll("[data-delq]")) {
    b.onclick = async function () {
      b.disabled = true;
      const r = await rpc("teacher_delete_question", { p_pin: T.pin, p_qid: Number(b.dataset.delq) });
      T.delAsk = null;
      if (r.error) toast(r.error); else toast("삭제했어요 · 뒤 번호를 당겼어요");
      loadTeacher(true);
    };
  }
  for (const b of app.querySelectorAll("[data-edit]")) {
    b.onclick = function () { editQuestion(T.data.questions.find(function (q) { return String(q.id) === b.dataset.edit; })); };
  }
  for (const b of app.querySelectorAll("[data-accept]")) {
    b.onclick = async function () {
      const r = await rpc("teacher_accept", { p_pin: T.pin, p_qid: Number(b.dataset.qid), p_response: b.dataset.accept, p_ok: b.dataset.ok === "1" });
      if (r.error) toast(r.error); else toast(b.dataset.ok === "1" ? "정답으로 인정했어요" : "인정을 취소했어요");
      loadTeacher(true);
    };
  }
}

async function bulk(to) {
  const r = await rpc("teacher_set_session_status", { p_pin: T.pin, p_session: T.session, p_status: to });
  if (r.error) toast(r.error === "PIN" ? "PIN을 다시 확인해 주세요" : r.error);
  else toast({ open: "문제를 모두 열었어요", locked: "제출을 마감했어요", revealed: "정답을 공개했어요", ready: "초기화했어요" }[to]);
  loadTeacher(true);
}

function teacherCard(q, total) {
  const rate = q.submitted ? Math.round(q.correct * 100 / q.submitted) : 0;
  let h = '<div class="card"><div class="row"><span class="q-label">' + q.qno + ". " + esc(q.label) + "</span>" + statusPill(q.status) +
    '<span class="grow"></span><span class="small muted">' + (q.kind === "mc" ? "객관식" : "단답형") + " · " + q.points + "점</span></div>" +
    '<div class="q-body">' + esc(q.body) + "</div>" +
    '<div class="small muted" style="margin:-6px 0 10px">정답: <b style="color:var(--teal)">' + esc(q.kind === "mc" ? answerText(q) : q.answer.join(" / ")) + "</b></div>";

  if (q.status === "ready") {
    if (q.kind === "mc") {
      for (let i = 0; i < q.choices.length; i++) {
        const ok = q.answer.indexOf(String(i + 1)) >= 0;
        h += '<div class="grp"><span' + (ok ? ' style="color:var(--teal);font-weight:700"' : "") + '>' + circled(i) + " " + esc(q.choices[i]) + (ok ? " ✓" : "") + "</span></div>";
      }
    } else {
      h += '<div class="small muted">인정 답안: ' + esc(q.answer.join(" / ")) + "</div>";
    }
  }
  if (q.explanation) h += '<div class="note ex" style="margin-top:8px">해설: ' + esc(q.explanation) + "</div>";
  if (q.status !== "ready") {
    h += '<div class="row small" style="margin:10px 0 8px"><b>제출 ' + q.submitted + " / " + total + "명</b><span class=\"muted\">정답 " + q.correct + "명 · 정답률 " + rate + "%</span></div>";
    if (q.kind === "mc") {
      const counts = q.choices.map(function () { return 0; });
      for (const g of q.groups) { const i = parseInt(g.response, 10) - 1; if (i >= 0 && i < counts.length) counts[i] += g.n; }
      for (let i = 0; i < q.choices.length; i++) {
        const ok = q.answer.indexOf(String(i + 1)) >= 0;
        const pct = q.submitted ? Math.round(counts[i] * 100 / q.submitted) : 0;
        h += '<div class="grp"><span>' + circled(i) + " " + esc(q.choices[i]) + '</span><b class="small">' + counts[i] + '</b><div class="bar ' + (ok ? "ok" : "") + '"><i style="width:' + pct + '%"></i></div></div>';
      }
    } else {
      for (const g of q.groups) {
        h += '<div class="grp"><span>' + esc(g.response) + '</span><b class="small">' + g.n + "명</b>" +
          '<button class="btn sm ' + (g.ok ? "ghost" : "teal") + '" data-qid="' + q.id + '" data-accept="' + esc(g.response) + '" data-ok="' + (g.ok ? "0" : "1") + '">' +
          (g.ok ? "인정 취소" : "정답 인정") + "</button></div>";
      }
    }
  }
  h += '<div class="row" style="margin-top:12px">';
  h += '<span class="grow"></span><button class="btn ghost sm" data-edit="' + q.id + '">수정</button>';
  if (T.delAsk === q.id) {
    h += '<span class="small err">' + q.qno + '번을 지우면 뒤 번호가 하나씩 당겨져요.</span><button class="btn red sm" data-delq="' + q.id + '">삭제 확인</button><button class="btn ghost sm" data-cancel="1">취소</button>';
  } else {
    h += '<button class="btn ghost sm" data-delask="' + q.id + '">삭제</button>';
  }
  if (q.status !== "ready") {
    if (T.confirm === q.id) {
      h += '<span class="small err">제출 기록이 지워져요.</span><button class="btn red sm" data-qid="' + q.id + '" data-set="ready">초기화 확인</button><button class="btn ghost sm" data-cancel="1">취소</button>';
    } else {
      h += '<button class="btn ghost sm" data-qid="' + q.id + '" data-set="ready">초기화</button>';
    }
  }
  return h + "</div></div>";
}

function editQuestion(q) {
  const m = document.createElement("div");
  m.className = "modal";
  const ansStr = q.kind === "mc" ? q.answer.join(",") : q.answer.join(", ");
  m.innerHTML = '<form class="card stack" id="qf" novalidate><h2>' + (q.id ? "문제 수정" : "새 문제") + "</h2>" +
    '<div class="grid2"><div class="field"><label for="f-s">차시</label><input class="input" id="f-s" type="number" min="1" value="' + q.session + '"></div>' +
    '<div class="field"><label for="f-n">번호</label><input class="input" id="f-n" type="number" min="1" value="' + q.qno + '"></div>' +
    '<div class="field"><label for="f-k">유형</label><select class="input" id="f-k"><option value="mc"' + (q.kind === "mc" ? " selected" : "") + '>객관식</option><option value="short"' + (q.kind === "short" ? " selected" : "") + ">단답형</option></select></div>" +
    '<div class="field"><label for="f-p">점수</label><input class="input" id="f-p" type="number" min="0" value="' + q.points + '"></div></div>' +
    '<div class="field"><label for="f-l">이름표 (예: 확인 문제 Q1)</label><input class="input" id="f-l" value="' + esc(q.label) + '"></div>' +
    '<div class="field"><label for="f-b">문제</label><textarea class="input" id="f-b" rows="3">' + esc(q.body) + "</textarea></div>" +
    '<div class="field" id="f-cw"><label for="f-c">보기 (한 줄에 하나)</label><textarea class="input" id="f-c" rows="4">' + esc((q.choices || []).join("\n")) + "</textarea></div>" +
    '<div class="field"><label for="f-a" id="f-al"></label><input class="input" id="f-a" value="' + esc(ansStr) + '"></div>' +
    '<div class="field"><label for="f-e">해설</label><input class="input" id="f-e" value="' + esc(q.explanation) + '"></div>' +
    '<div class="err" id="f-err"></div>' +
    '<div class="row"><button class="btn" type="submit">저장</button><button class="btn ghost" type="button" id="f-x">닫기</button><span class="grow"></span>' +
    (q.id ? '<button class="btn ghost" type="button" id="f-d">삭제</button>' : "") + "</div></form>";
  document.body.appendChild(m);
  const kindSel = m.querySelector("#f-k");
  function syncKind() {
    const mc = kindSel.value === "mc";
    m.querySelector("#f-cw").hidden = !mc;
    m.querySelector("#f-al").textContent = mc ? "정답 보기 번호 (1부터, 복수 정답은 쉼표)" : "인정할 답 (쉼표로 여러 개)";
  }
  kindSel.onchange = syncKind; syncKind();
  m.querySelector("#f-x").onclick = function () { m.remove(); };
  let delArmed = false;
  const del = m.querySelector("#f-d");
  if (del) del.onclick = async function () {
    if (!delArmed) { delArmed = true; del.textContent = "정말 삭제"; del.className = "btn red"; return; }
    const r = await rpc("teacher_delete_question", { p_pin: T.pin, p_qid: q.id });
    if (r.error) { m.querySelector("#f-err").textContent = r.error; return; }
    m.remove(); toast("삭제했어요"); loadTeacher(true);
  };
  m.querySelector("#qf").addEventListener("submit", async function (e) {
    e.preventDefault();
    const kind = kindSel.value;
    const choices = [];
    for (const line of m.querySelector("#f-c").value.split("\n")) { if (line.trim()) choices.push(line.trim()); }
    const answer = [];
    for (const a of m.querySelector("#f-a").value.split(",")) { if (a.trim()) answer.push(a.trim()); }
    const payload = {
      id: q.id || "", session: parseInt(m.querySelector("#f-s").value, 10), qno: parseInt(m.querySelector("#f-n").value, 10),
      label: m.querySelector("#f-l").value.trim(), kind: kind, body: m.querySelector("#f-b").value.trim(),
      choices: kind === "mc" ? choices : [], answer: answer, explanation: m.querySelector("#f-e").value.trim(),
      points: parseInt(m.querySelector("#f-p").value, 10) || 0
    };
    if (kind === "mc") {
      for (const a of answer) {
        const i = parseInt(a, 10);
        if (!(i >= 1 && i <= choices.length)) { m.querySelector("#f-err").textContent = "정답 번호는 1~" + choices.length + " 사이여야 해요."; return; }
      }
    }
    const r = await rpc("teacher_save_question", { p_pin: T.pin, p_q: payload });
    if (r.error) { m.querySelector("#f-err").textContent = r.error; return; }
    m.remove(); toast("저장했어요"); loadTeacher(true);
  });
}

async function loadTMissions(force) {
  const r = await rpc("teacher_missions", { p_pin: T.pin, p_session: T.session });
  if (r.error === "PIN") { sstore("quiz_tpin", null); return teacherLogin("PIN을 다시 입력해 주세요."); }
  const box = document.getElementById("tmis");
  if (!box) return;
  if (r.error) { box.innerHTML = '<div class="card err">미션 기능을 쓰려면 Supabase에서 update_미션.sql을 먼저 실행하세요. (' + esc(r.error) + ")</div>"; return; }
  const sig = JSON.stringify(r);
  if (!force && sig === T.msig) return;
  if (!force && document.querySelector(".modal")) return;
  T.msig = sig; T.mdata = r;
  renderTMissions();
}
const MAT_MAX = 50 * 1024 * 1024;
async function loadTMats() {
  const r = await rpc("teacher_materials", { p_pin: T.pin });
  const box = document.getElementById("tmats");
  if (!box) return;
  if (r.error) { box.innerHTML = '<div class="card err">' + esc(r.error) + "</div>"; return; }
  T.mats = r.materials || [];
  renderTMats();
}
function renderTMats() {
  const box = document.getElementById("tmats");
  if (!box) return;
  const list = T.mats.slice().sort(function (a, b) { return (b.session - a.session) || (b.id - a.id); });
  let opts = '<option value="0">공통 (차시 없음)</option>';
  for (let i = 1; i <= SESSIONS; i++) opts += '<option value="' + i + '"' + (i === T.session ? " selected" : "") + ">" + i + "차시</option>";
  let h = '<div class="card stack"><h2>자료 올리기</h2>' +
    '<div class="row" style="align-items:flex-end"><div class="field" style="flex:0 0 150px"><label for="mt-s">차시</label><select class="input" id="mt-s">' + opts + "</select></div>" +
    '<div class="field grow"><label for="mt-t">제목 (비우면 파일 이름)</label><input class="input" id="mt-t" placeholder="예: 4차시 실습 예제"></div></div>' +
    '<div class="field"><label for="mt-n">설명 (선택)</label><input class="input" id="mt-n" placeholder="예: 압축을 풀고 main.py를 여세요"></div>' +
    '<div class="row"><label class="btn orange filebtn">' + (T.matBusy ? "올리는 중… " + T.matBusy : "파일 선택해서 올리기") +
    '<input type="file" id="mt-f" multiple' + (T.matBusy ? " disabled" : "") + '></label>' +
    '<label class="row small" style="gap:6px"><input type="checkbox" id="mt-v" checked> 바로 학생에게 보이기</label>' +
    '<span class="small muted grow">여러 파일을 한 번에 고를 수 있어요 · 파일당 50MB 이하</span></div></div>';
  h += '<div class="card"><div class="row" style="margin-bottom:4px"><h2 class="grow">올린 자료 ' + list.length + "개</h2></div>";
  if (!list.length) h += '<div class="muted">아직 올린 자료가 없어요.</div>';
  let cur = null;
  for (const x of list) {
    if (x.session !== cur) { cur = x.session; h += '<div class="q-label" style="margin-top:12px">' + (cur ? cur + "차시" : "공통") + "</div>"; }
    h += matRow(x, true).replace(/<\/div>$/, "") +
      '<div class="acts">' + (x.visible === false ? '<span class="pill p-ready">숨김</span>' : "") +
      '<a class="btn ghost sm" href="' + storeUrl("materials", x.file_path) + '" target="_blank" rel="noopener">열기</a>' +
      '<button class="btn ghost sm" data-matvis="' + x.id + '">' + (x.visible === false ? "보이기" : "숨기기") + "</button>" +
      (T.confirm === "t" + x.id ? '<button class="btn red sm" data-matdel="' + x.id + '">삭제 확인</button><button class="btn ghost sm" data-matcancel="1">취소</button>'
        : '<button class="btn ghost sm" data-matdelask="' + x.id + '">삭제</button>') + "</div></div>";
  }
  box.innerHTML = h + "</div>";
  const fi = document.getElementById("mt-f");
  fi.onchange = function () { if (fi.files && fi.files.length) uploadMats(Array.prototype.slice.call(fi.files)); };
  for (const b of box.querySelectorAll("[data-matvis]")) {
    b.onclick = async function () {
      const x = T.mats.find(function (m) { return m.id === Number(b.dataset.matvis); });
      const r = await rpc("teacher_save_material", { p_pin: T.pin, p_m: { id: x.id, session: x.session, title: x.title, note: x.note || "", visible: x.visible === false } });
      if (r.error) toast(r.error);
      loadTMats();
    };
  }
  for (const b of box.querySelectorAll("[data-matdelask]")) b.onclick = function () { T.confirm = "t" + b.dataset.matdelask; renderTMats(); };
  for (const b of box.querySelectorAll("[data-matcancel]")) b.onclick = function () { T.confirm = null; renderTMats(); };
  for (const b of box.querySelectorAll("[data-matdel]")) {
    b.onclick = async function () {
      T.confirm = null;
      const r = await rpc("teacher_delete_material", { p_pin: T.pin, p_id: Number(b.dataset.matdel) });
      if (r.error) toast(r.error); else toast("자료를 지웠어요");
      loadTMats();
    };
  }
}
async function uploadMats(files) {
  const sess = Number(document.getElementById("mt-s").value);
  const title = document.getElementById("mt-t").value.trim();
  const note = document.getElementById("mt-n").value.trim();
  const vis = document.getElementById("mt-v").checked;
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (f.size > MAT_MAX) { toast(f.name + ": 50MB 이하 파일만 올릴 수 있어요"); continue; }
    T.matBusy = (i + 1) + "/" + files.length; renderTMats();
    const t = await rpc("teacher_material_ticket", { p_pin: T.pin });
    if (t.error) { toast(t.error); break; }
    const m = /\.[A-Za-z0-9]{1,8}$/.exec(f.name);
    const path = t.ticket + "/" + Date.now() + "-" + i + (m ? m[0].toLowerCase() : "");
    const up = await sb.storage.from("materials").upload(path, f, { contentType: f.type || "application/octet-stream", upsert: false });
    if (up.error) { toast("업로드 실패: " + up.error.message); continue; }
    const r = await rpc("teacher_save_material", { p_pin: T.pin, p_m: {
      id: "", session: sess, title: files.length === 1 && title ? title : f.name.replace(/\.[^.]+$/, ""), note: note, visible: vis,
      file_path: path, file_name: f.name, file_type: f.type || "", file_size: f.size } });
    if (r.error) { toast(r.error); continue; }
    ok++;
  }
  T.matBusy = null;
  if (ok) toast("자료 " + ok + "개를 올렸어요");
  await loadTMats();
  const tt = document.getElementById("mt-t"); if (tt && ok) tt.value = "";
}

function editMission(m) {
  const wrap = document.createElement("div");
  wrap.className = "modal";
  wrap.innerHTML = '<form class="card stack" id="mf"><h2>' + (m.id ? "미션 수정" : T.session + "차시 새 미션") + "</h2>" +
    '<div class="field"><label for="mtitle">제목</label><input class="input" id="mtitle" value="' + esc(m.title) + '" placeholder="예: 미니 공모전: 주문서대로 그리기"></div>' +
    '<div class="field"><label for="mbody">안내 (학생에게 보여요)</label><textarea class="input" id="mbody" placeholder="무엇을 올리면 되는지 써 주세요">' + esc(m.body) + "</textarea></div>" +
    '<div class="row"><label class="row" style="gap:6px"><input type="checkbox" id="mallowt"' + (m.allow_text ? " checked" : "") + "> 글 받기</label>" +
    '<label class="row" style="gap:6px"><input type="checkbox" id="mallowf"' + (m.allow_file ? " checked" : "") + "> 파일 받기 (10MB 이하)</label></div>" +
    '<div class="err" id="merr"></div><div class="row"><button class="btn" type="submit">저장</button><button class="btn ghost" type="button" id="mcancel">취소</button></div></form>';
  document.body.appendChild(wrap);
  document.getElementById("mcancel").onclick = function () { wrap.remove(); };
  document.getElementById("mf").addEventListener("submit", async function (e) {
    e.preventDefault();
    const at = document.getElementById("mallowt").checked, af = document.getElementById("mallowf").checked;
    if (!at && !af) { document.getElementById("merr").textContent = "글이나 파일 중 하나는 받아야 해요."; return; }
    const r = await rpc("teacher_save_mission", { p_pin: T.pin, p_m: { id: m.id || "", session: T.session, title: document.getElementById("mtitle").value.trim(), body: document.getElementById("mbody").value, allow_text: at, allow_file: af } });
    if (r.error) { document.getElementById("merr").textContent = r.error; return; }
    wrap.remove(); loadTMissions(true);
  });
}

  T.studs = r.students;
  let h = '<div class="row" style="margin-bottom:10px"><h2 class="grow">누적 점수 (정답 공개된 문제 기준)</h2><button class="btn sm" id="csv">CSV 내려받기</button></div>';
  if (!r.students.length) { el.innerHTML = h + '<div class="muted">아직 접속한 학생이 없어요.</div>'; bindCsv(); return; }

      toast(x.error || "PIN을 " + np + "(으)로 바꿨어요");
      loadStudents();
    };
  }
  for (const b of el.querySelectorAll("[data-fix]")) {
    b.onclick = async function () {
      const s = T.studs.find(function (x) { return x.student_id === b.dataset.fix; });
      const nid = window.prompt("학번 (잘못 입력했다면 고치세요)", s.student_id); if (!nid) return;
      const nn = window.prompt("이름", s.name); if (!nn) return;
      const x = await rpc("teacher_update_student", { p_pin: T.pin, p_sid: s.student_id, p_new_sid: nid, p_name: nn });
      toast(x.error || "수정했어요");
      loadStudents();
    };
  }
  document.getElementById("npinb").onclick = async function () {
    const v = document.getElementById("npin").value;
    const x = await rpc("teacher_change_pin", { p_pin: T.pin, p_new: v });
    if (x.error) { toast(x.error); return; }
    sstore("quiz_tpin", v); T.pin = v; toast("선생님 PIN을 바꿨어요");
  };
}

function bindCsv() {
  document.getElementById("csv").onclick = function () {
    const rows = [["순위", "학번", "이름", "총점", "정답수", "정답시간합(초)"]];
    for (let i = 1; i <= SESSIONS; i++) rows[0].push(i + "차시");
    for (const s of T.studs || []) {
      const r = [s.rank || "", s.student_id, s.name, s.points, s.correct, s.time_s];
      for (let i = 1; i <= SESSIONS; i++) r.push(s.by_session[i] != null ? s.by_session[i] : "");
      rows.push(r);
    }
    const lines = [];
    for (const r of rows) {
      const cells = [];
      for (const c of r) cells.push('"' + String(c).replace(/"/g, '""') + '"');
      lines.push(cells.join(","));
    }
    const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "AI-POT_확인퀴즈_점수_" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
  };
}

const V = { session: 1, data: null, sig: "", pin: null };

function screenView(session) {
  V.session = session; V.pin = null; V.sig = "";
  loadScreen(true);
  onLive(function () { loadScreen(false); });
  timer = setInterval(function () { loadScreen(false); }, 2000);
}

async function loadScreen(force) {
  const r = await rpc("screen_state", { p_session: V.session });
  if (r.error) { app.innerHTML = '<div class="wrap"><div class="card err">' + esc(r.error) + "</div></div>"; return; }
  const sig = JSON.stringify(r);
  if (!force && sig === V.sig) return;
  V.sig = sig; V.data = r;
  renderScreen();
}

function renderScreen() {
  const d = V.data;
  const qs = d.questions;
  let cur = null;
  if (V.pin) cur = qs.find(function (q) { return q.id === V.pin; }) || null;
  if (!cur) cur = qs.find(function (q) { return q.status === "open"; }) || qs.find(function (q) { return q.status === "locked"; }) || qs[0] || null;

  let main = "";
  if (!cur) {
    main = '<div class="card empty" style="display:grid;place-items:center;gap:12px"><h1 style="font-size:40px">' + V.session + '차시 확인퀴즈</h1>' +
      '<p class="muted" style="font-size:22px">QR을 찍고 학번으로 입장하세요. 문제가 열리면 바로 나타나요.</p><div style="width:min(360px,70vw)" class="qrbox" id="qrbig"></div>' +
      '<div class="url" style="font-size:22px">' + esc(BASE_URL) + "</div></div>";
  } else {
    main = '<div class="card stack"><div class="row"><span class="q-label" style="font-size:18px">' + esc(cur.label) + "</span>" + statusPill(cur.status) + "</div>" +
      '<div class="q-body">' + esc(cur.body) + "</div>";
    if (cur.kind === "mc") {
      const counts = cur.choices.map(function () { return 0; });
      if (cur.dist) for (const g of cur.dist) { const i = parseInt(g.response, 10) - 1; if (i >= 0 && i < counts.length) counts[i] += g.n; }
      main += '<div class="choices">';
      for (let i = 0; i < cur.choices.length; i++) {
        const ok = cur.answer && cur.answer.indexOf(String(i + 1)) >= 0;
        main += '<div class="choice' + (ok ? " ok" : "") + '"><span class="n">' + (i + 1) + '</span><span class="grow">' + esc(cur.choices[i]) + "</span>" +
          (cur.status === "revealed" ? "<b>" + counts[i] + "명</b>" : "") + "</div>";
      }
      main += "</div>";
    } else if (cur.status === "revealed") {
      main += '<div class="note ok" style="font-size:26px">정답: ' + esc(cur.answer[0]) + "</div>";
      if (cur.dist && cur.dist.length) {
        main += '<div class="stack" style="gap:6px">';
        for (const g of cur.dist) main += '<div class="row" style="font-size:20px"><span class="pill ' + (g.ok ? "p-revealed" : "p-ready") + '">' + (g.ok ? "정답" : "오답") + "</span><span>" + esc(g.response) + '</span><span class="muted">' + g.n + "명</span></div>";
        main += "</div>";
      }
    } else {
      main += '<div class="note ex" style="font-size:22px">단답형 · 철자와 띄어쓰기까지 정확하게!</div>';
    }
    if (cur.status === "revealed") {
      const rate = cur.submitted ? Math.round(cur.correct * 100 / cur.submitted) : 0;
      main += '<div class="row" style="font-size:22px"><b>정답률 ' + rate + "%</b><span class=\"muted\">(" + cur.correct + " / " + cur.submitted + "명)</span></div>";
      if (cur.explanation) main += '<div class="note ex" style="font-size:22px">' + esc(cur.explanation) + "</div>";
    } else {
      main += '<div class="row"><span class="big-count">' + cur.submitted + '</span><span style="font-size:22px" class="muted">명 제출</span>' +
        (cur.status === "open" ? '<span class="dot" style="margin-left:6px"></span>' : "") + "</div>";
    }
    main += "</div>";
    if (qs.length > 1) {
      main += '<div class="chips">';
      for (const q of qs.slice().sort(function (a, b) { return a.qno - b.qno; })) {
        main += '<button class="chip" data-show="' + q.id + '" aria-pressed="' + (q.id === cur.id) + '">' + esc(q.label || q.qno) + "</button>";
      }
      main += "</div>";
    }
  }

  let side = '<div class="stack">';
  if (cur) side += '<div class="qrbox" id="qrsmall"></div><div class="url small">' + esc(BASE_URL) + "</div>";
  side += '<div class="card"><h2>' + V.session + "차시 TOP 5</h2>" + boardHtml(d.top_session) + "</div>" +
    '<div class="card"><h2>누적 TOP 10</h2>' + boardHtml(d.top_all) + "</div>" +
    '<div class="row small muted"><span>차시</span><select class="input" id="ssel" style="width:auto;padding:6px 10px">';
  for (let i = 1; i <= SESSIONS; i++) side += '<option value="' + i + '"' + (i === V.session ? " selected" : "") + ">" + i + "</option>";
  side += "</select><span>· 학생 " + d.students + "명</span></div></div>";

  app.innerHTML = '<div class="screen"><div class="stack">' + main + "</div>" + side + "</div>";
  const qEl = document.getElementById(cur ? "qrsmall" : "qrbig");
  if (qEl && window.QRCode) new QRCode(qEl, { text: BASE_URL, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
  for (const b of app.querySelectorAll("[data-show]")) {
    b.onclick = function () { V.pin = Number(b.dataset.show); renderScreen(); };
  }
  document.getElementById("ssel").onchange = function (e) { location.hash = "screen-" + e.target.value; };
}

function boardHtml(list) {
  if (!list || !list.length) return '<p class="muted small" style="margin:8px 0 0">정답이 공개되면 순위가 나타나요.</p>';
  let h = '<table class="lb" style="margin-top:6px"><tbody>';
  for (const p of list) {
    h += '<tr><td style="width:40px"><span class="medal ' + (p.rank <= 3 ? "m" + p.rank : "") + '">' + p.rank + "</span></td><td>" + esc(p.name) +
      '</td><td style="text-align:right"><b>' + p.points + "</b></td></tr>";
  }
  return h + "</tbody></table>";
}

// ---------- 시작 ----------
(function start() {
  if (!window.supabase || !CFG.SUPABASE_URL || CFG.SUPABASE_URL.indexOf("YOUR-") >= 0) {
    app.innerHTML = '<div class="wrap"><div class="card stack"><h1>설정이 필요해요</h1><p>config.js 파일에 Supabase 주소(SUPABASE_URL)와 anon 키를 넣어 주세요.</p></div></div>';
    return;
  }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: false } });
  document.title = CFG.TITLE || document.title;
  window.addEventListener("hashchange", route);
  route();
})();
</script>
